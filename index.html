<style>
:root{
  --bg:#f6f1f5; --paper:#fff; --ink:#26142a; --muted:#6f6272; --line:#e2d8e2;
  --plum:#7a1666; --plum-dark:#4a0a3d; --plum-soft:#f1e3ee;
  --green:#2f8a5c; --green-bg:#e0f1e8; --off:#7a5a68; --off-bg:#efe6ec;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "IBM Plex Sans",system-ui,sans-serif}
[hidden]{display:none!important}
.top{background:linear-gradient(90deg,var(--plum-dark),var(--plum));color:#fff;border-bottom:4px solid var(--green)}
.top .in{max-width:860px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px}
.top img{width:52px;height:auto;border-radius:8px;display:block}
.top h1{font:500 22px/1.15 "IBM Plex Serif",Georgia,serif;margin:0}
.top p{margin:2px 0 0;font-size:13px;opacity:.8}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
input[type=search],input[type=password]{width:100%;font:inherit;font-size:18px;padding:14px 16px;border:2px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
input:focus{outline:none;border-color:var(--plum)}
.login{max-width:360px;margin:7vh auto 0;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:26px 24px;text-align:center}
.login img{width:150px;border-radius:12px;display:block;margin:0 auto 14px}
.login h2{font:500 22px "IBM Plex Serif",Georgia,serif;margin:0 0 4px}
.login .sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.login .rec{display:flex;align-items:center;gap:8px;margin:12px 2px 0;font-size:14px;color:var(--muted);text-align:left;cursor:pointer}
.login .rec input{width:18px;height:18px;accent-color:var(--plum);margin:0}
.login button{width:100%;margin-top:14px;padding:12px;font-size:16px;font-weight:500;background:var(--plum);color:#fff;border:0;border-radius:8px;cursor:pointer}
.login button:disabled{opacity:.6}
.search{position:sticky;top:0;background:var(--bg);padding:8px 0 12px;z-index:2}
.hint{color:var(--muted);margin:0 0 10px;font-size:14px}
.status{font-size:13px;color:var(--muted);margin-top:8px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.link{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--plum);padding:4px 10px;border-radius:6px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
.person{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--plum);border-radius:8px;margin:0 0 14px;overflow:hidden}
.phead{padding:14px 16px 8px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.name{font-weight:600;font-size:18px}
.dni{font-variant-numeric:tabular-nums;color:var(--plum);font-weight:600}
.dni.none{color:var(--muted);font-weight:400}
.meta{padding:0 16px 10px;color:var(--muted);font-size:13px}
.tag{display:inline-block;background:var(--plum-soft);color:var(--plum-dark);font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;margin-right:6px}
.moves{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.mv{padding:10px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;border-bottom:1px solid var(--line)}
.mv:last-child{border-bottom:0}
.mv.baja{background:#fbf8fa}
.badge{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.badge.ok{background:var(--green-bg);color:var(--green)}
.badge.off{background:var(--off-bg);color:var(--off)}
.socio{font-weight:500}
.det{grid-column:2;font-size:13px;color:var(--muted)}
.empty{padding:40px 8px;text-align:center;color:var(--muted)}
.err{background:#fbeceb;border:1px solid #e3b5b1;color:#8a2a22;padding:10px 14px;border-radius:8px;margin:10px 0;font-size:14px;text-align:left}
</style>
</head>
<body>

    <h2>Buscador de adherentes</h2>
    <p class="sub">Acceso restringido. Ingresá la clave.</p>
    <input id="pw" type="password" placeholder="Clave" autocomplete="current-password" autofocus>
    <label class="rec"><input id="rec" type="checkbox"> Recordar en este dispositivo (30 días)</label>
    <button id="enter" type="button">Ingresar</button>
    <div id="lerr"></div>
  </section>

  <section id="app" hidden>
    <p class="hint">Escribí cualquier dato: nombre, apellido, DNI, número de socio, teléfono, email… completo o parcial.</p>
    <div class="search">
      <input id="q" type="search" placeholder="Ej: gonzalez 2345 · 30123456 · 1520" autocomplete="off">
      <div class="status"><span id="st">Escribí al menos 3 caracteres.</span><button class="link" id="exit" type="button">Salir</button></div>
    </div>
    <div id="err"></div>
    <div id="out"></div>
  </section>
</div>

<script>
/* ====== CONFIGURACIÓN ====== */
const API_URL = "https://script.google.com/macros/s/AKfycbxjffMTGqQBtsxEaSGRyvh-P7x9r0YfAiYND6BBQtmJBLsTZt4rsG7NPNLiL0p9ZVmq/exec";   // termina en /exec
/* ============================ */

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEY = "cespaz_buscador_sesion";

let token = "";          // la clave nunca se guarda: solo un token de sesión firmado por el servidor
let seq = 0;

const store = {
  get(){ try{ return localStorage.getItem(KEY)||""; }catch(e){ return ""; } },
  set(v){ try{ localStorage.setItem(KEY,v); }catch(e){} },
  del(){ try{ localStorage.removeItem(KEY); }catch(e){} }
};

async function api(body){
  const res = await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,token})});
  if(!res.ok) throw new Error("HTTP "+res.status);
  return res.json();
}

function mostrarApp(){ $("login").hidden=true; $("app").hidden=false; $("top").hidden=false; $("q").focus(); }

function salir(msg){
  token=""; store.del(); $("q").value=""; $("out").innerHTML=""; $("err").innerHTML="";
  $("app").hidden=true; $("top").hidden=true; $("login").hidden=false;
  $("lerr").innerHTML = msg?`<div class="err">${esc(msg)}</div>`:"";
  $("pw").focus();
}

async function entrar(){
  const clave=$("pw").value; if(!clave) return;
  $("lerr").innerHTML=""; $("enter").disabled=true;
  try{
    token="";
    const res = await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({accion:"login",clave,recordar:$("rec").checked})});
    const r = await res.json();
    if(!r.ok){ $("lerr").innerHTML=`<div class="err">${esc(r.msg||"No se pudo ingresar.")}</div>`; return; }
    token=r.token; $("rec").checked?store.set(token):store.del();
    $("pw").value=""; mostrarApp();
  }catch(e){
    $("lerr").innerHTML=`<div class="err">No se pudo conectar con el servidor.</div>`;
  }finally{ $("enter").disabled=false; }
}

function render(res){
  const out=$("out");
  if(!res.people.length){ out.innerHTML='<div class="empty">No se encontró ningún adherente con ese dato.</div>'; $("st").textContent=""; return; }
  $("st").textContent = res.total>res.people.length
    ? `Mostrando ${res.people.length} de ${res.total}. Agregá más datos para acotar.`
    : `${res.total} resultado${res.total>1?"s":""}`;
  out.innerHTML = res.people.map(p=>{
    const meta=[p.parentesco, p.fecnac&&("Nac. "+p.fecnac), p.tel, p.email].filter(Boolean).map(esc).join(" · ");
    const dni = p.numero ? `<span class="dni">${esc(p.doc||"DNI")} ${esc(p.numero)}</span>` : `<span class="dni none">Sin DNI cargado</span>`;
    return `<article class="person">
      <div class="phead"><span class="name">${esc(p.name)}</span>${dni}</div>
      ${(meta||p.titular)?`<div class="meta">${p.titular?'<span class="tag">Socio titular</span>':""}${meta}</div>`:""}
      <ul class="moves">${p.rows.map(r=>`
        <li class="mv ${r.activo?"":"baja"}">
          <span class="badge ${r.activo?"ok":"off"}">${r.activo?"Activo":"Baja"}</span>
          <span class="socio">Socio ${esc(r.socio)}${r.nombresocio?" — "+esc(r.nombresocio):""}</span>
          <span class="det">${[
            r.fecadhfam&&"Adhirió "+esc(r.fecadhfam),
            r.fecbajaf&&"Baja familiar "+esc(r.fecbajaf),
            r.estado&&"Estado: "+esc(r.estado),
            r.estsoc&&"Socio: "+esc(r.estsoc)+(r.fecbajas?" (baja "+esc(r.fecbajas)+")":""),
            r.tarifa&&"Tarifa "+esc(r.tarifa)
          ].filter(Boolean).join(" · ")}</span>
        </li>`).join("")}
      </ul></article>`;
  }).join("");
}

async function buscar(){
  const q=$("q").value.trim(), mine=++seq;
  $("err").innerHTML="";
  if(q.replace(/\s/g,"").length<3){ $("out").innerHTML='<div class="empty">Escribí al menos 3 caracteres.</div>'; $("st").textContent=""; return; }
  $("st").textContent="Buscando…";
  try{
    const r=await api({accion:"buscar",q});
    if(mine!==seq) return;                       // llegó una respuesta vieja
    if(!r.ok){
      if(r.error==="sesion"||r.error==="clave"||r.error==="bloqueado"){ salir(r.msg); return; }
      throw new Error(r.msg||"error");
    }
    render(r);
  }catch(e){
    if(mine!==seq) return;
    $("st").textContent=""; $("err").innerHTML=`<div class="err">No se pudo completar la búsqueda. Probá de nuevo.</div>`;
  }
}

async function iniciar(){
  const t=store.get(); if(!t) return;
  token=t; $("login").hidden=true;               // evita el parpadeo del login mientras se verifica
  try{
    const r=await api({accion:"ping"});
    if(r.ok){ mostrarApp(); return; }
  }catch(e){}
  salir();
}

let t; $("q").addEventListener("input",()=>{clearTimeout(t);t=setTimeout(buscar,400);});
$("enter").addEventListener("click",entrar);
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")entrar();});
$("exit").addEventListener("click",()=>salir());
iniciar();
</script>
</body>
</html>
